plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.meganet.tvplayer'
    compileSdk 33

    defaultConfig {
        applicationId "br.com.meganet.tvplayer"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
}
