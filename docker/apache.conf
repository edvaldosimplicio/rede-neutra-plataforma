<VirtualHost *:80>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        # SEGURANÇA: Remove listagem de diretórios
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # SEGURANÇA: Headers HTTP de proteção
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"
    Header always set Content-Security-Policy "default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; font-src 'self' https: data:;"

    # SEGURANÇA: Cookies de sessão seguros
    Header always edit Set-Cookie ^(.*)$ "$1; HttpOnly; SameSite=Strict"

    # SEGURANÇA: Esconde versão do servidor
    ServerTokens Prod
    ServerSignature Off

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
